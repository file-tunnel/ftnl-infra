apiVersion: apps/v1
kind: Deployment
metadata:
  name: ftnl-web-server
  annotations:
    secret.reloader.stakater.com/reload: ftnl-web-server-secrets
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ftnl-web-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ftnl-web-server
    spec:
      serviceAccountName: ftnl-web-server
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: ghcr.io/file-tunnel/ftnl-web-server
          imagePullPolicy: IfNotPresent
          env:
            - name: FTNL_WEB_BIND
              value: 0.0.0.0:3000
            - name: FTNL_API_ORIGIN
              value: https://api.file-tunnel.dev
          envFrom:
            - secretRef:
                name: ftnl-web-server-secrets
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 15
