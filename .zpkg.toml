[package]
org = "file-tunnel"
name = "ftnl-infra"
version = "0.1.0"
description = "File Tunnel Cloudflare, Kubernetes, Argo CD, and reviewed SQL desired state"
license = "MIT"
keywords = ["file-tunnel", "gitops", "kubernetes", "cloudflare", "argocd"]

[package.repository]
vcs = "git"
url = "https://github.com/file-tunnel/ftnl-infra"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "bash scripts/validate.sh"
exclude = [".env", ".env.*", "env/dec/**", ".direnv/**", ".cache/**", ".zed/**", ".vendor/**", "tmp/**", "**/*.log", ".DS_Store"]

[targets.repository]
dir = "."

[scripts]
test = "bash scripts/validate.sh"
