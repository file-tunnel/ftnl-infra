name: one-shot fold Supabase provider repo

on:
  push:
    branches: [infra/fold-supabase-20260914]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: file-tunnel/ftnl-supabase
          ref: 474c507a645a9a80ecff4d28a67e341fdaa089a1
          path: .supabase-source
          persist-credentials: false
      - name: Import provider overlay and rewrite authority
        shell: bash
        env:
          TARGET_REPO: file-tunnel/ftnl-infra
        run: |
          set -euo pipefail
          test ! -e modules/supabase/MIGRATED_FROM.md
          mkdir -p modules/supabase
          rsync -a --exclude '.git/' --exclude '.github/' --exclude 'AGENTS.md' --exclude '.gitignore' --exclude 'tmp/' --exclude 'temp/' .supabase-source/ modules/supabase/
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');const root='modules/supabase',repo=process.env.TARGET_REPO;
          const cp=path.join(root,'catalog.json'),c=JSON.parse(fs.readFileSync(cp,'utf8'));c.github.repository=repo;c.github.defaultBranch='main';
          for(const p of c.projects){const tp=path.join(root,p.target),t=JSON.parse(fs.readFileSync(tp,'utf8'));t.providerOverlay.repository=repo;for(const k of ['workingDirectory','supabaseDirectory','migrationsDirectory','functionsDirectory','configPath'])if(t.providerOverlay[k]&&!t.providerOverlay[k].startsWith('modules/supabase/'))t.providerOverlay[k]=`modules/supabase/${t.providerOverlay[k]}`;if(t.gitIntegration){t.gitIntegration.state='planned';t.gitIntegration.verifiedAt=null;if(t.gitIntegration.providerReadback){t.gitIntegration.providerReadback.state='pending';t.gitIntegration.providerReadback.verifiedAt=null;}}fs.writeFileSync(tp,JSON.stringify(t,null,2)+'\n');}
          fs.writeFileSync(cp,JSON.stringify(c,null,2)+'\n');const ref=c.canonicalProjectRef;
          fs.writeFileSync('.ores-infra.toml',`schema_version = 1\nlayout = "modules"\nmodules_root = "modules"\nenvironments_root = "environments"\n\n[providers.supabase]\ncanonical_path = "modules/supabase"\nsync_mode = "native_git"\nworking_directory = "modules/supabase/projects/${ref}"\nproject_catalog = "modules/supabase/catalog.json"\n\n[policy]\nprovider_native_paths_must_match = true\npath_filtered_ci = true\nstate_isolation = "per-provider-per-environment"\nsecrets = "sops-age"\n`);
          NODE
          cat > modules/supabase/MIGRATED_FROM.md <<'EOF'
          # Supabase provider migration provenance

          Canonical owner: `file-tunnel/ftnl-infra`.
          Imported from `file-tunnel/ftnl-supabase` at immutable commit `474c507a645a9a80ecff4d28a67e341fdaa089a1` on 2026-09-14.

          Live Supabase GitHub Integration settings are not changed here. Point the project at this infra repository and `modules/supabase/projects/<project-ref>` only after merge and provider read-back verification.
          EOF
          rm -rf .supabase-source .github/workflows/fold-supabase-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A && git diff --cached --check
          git commit -m 'infra: fold Supabase provider overlay into infra'
          git push origin HEAD:infra/fold-supabase-20260914