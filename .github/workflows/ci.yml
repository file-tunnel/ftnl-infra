name: infra-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.7.1"
      - run: ./scripts/validate.sh
      - name: Render manifests
        run: |
          mkdir rendered
          kustomize build argocd/apps > rendered/argocd.yaml
          kustomize build kubernetes/foundation > rendered/foundation.yaml
          kustomize build kubernetes/backend > rendered/backend.yaml
          kustomize build kubernetes/portal > rendered/portal.yaml
      - uses: docker://ghcr.io/yannh/kubeconform:v0.7.0
        with:
          entrypoint: /kubeconform
          args: -strict -summary -ignore-missing-schemas rendered
