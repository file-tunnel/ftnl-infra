name: gitops-plan

on:
  pull_request:
    paths:
      - ".github/workflows/gitops-*.yml"
      - ".sops.yaml"
      - "cloudflare/**"
      - "env/**"
      - "kubernetes/**"
      - "scripts/**"
      - "supabase/**"
      - "flake.*"
      - "justfile"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-plan-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - name: Validate credential-free GitOps plan
        run: nix develop --command just gitops-plan
