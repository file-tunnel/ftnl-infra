name: neon-contract
on:
  pull_request:
    paths:
      - ".ores-infra.toml"
      - "modules/neon/**"
      - "environments/**"
      - "docs/neon-modules-first-migration.md"
      - "neon/**"
      - ".github/workflows/neon-contract.yml"
  push:
    branches: [main]
    paths:
      - ".ores-infra.toml"
      - "modules/neon/**"
      - "environments/**"
      - "docs/neon-modules-first-migration.md"
      - "neon/**"
      - ".github/workflows/neon-contract.yml"

permissions:
  contents: read

concurrency:
  group: neon-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.12.1
          terraform_wrapper: false
      - name: Format modules-first Terraform
        run: |
          terraform fmt -check -recursive modules/neon/terraform
          terraform fmt -check -recursive environments
      - name: Validate every environment without backend or credentials
        shell: bash
        run: |
          set -euo pipefail
          for environment in preview staging production; do
            terraform -chdir="environments/${environment}" init -backend=false -input=false
            terraform -chdir="environments/${environment}" validate
          done
      - name: Reject tracked state and private-key material
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(terraform\.tfstate(\..*)?|[^/]+\.(pem|key))$'; then
            echo "tracked Terraform state/private key material is forbidden" >&2
            exit 1
          fi
      - run: git diff --exit-code
