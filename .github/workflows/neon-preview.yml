name: neon-preview
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - ".ores-infra.toml"
      - "modules/neon/**"
      - "environments/**"
      - "neon/**"
      - ".db-providers.json"
      - ".github/workflows/neon-preview.yml"

permissions:
  contents: read

jobs:
  branch:
    runs-on: ubuntu-24.04
    env:
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify live preview credentials
        id: preview_config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${NEON_PROJECT_ID}" && -n "${NEON_API_KEY}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Neon preview credentials are configured; live branch lifecycle is admitted."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live Neon preview is not configured for this repository/event; credential-free Terraform validation remains enforced by neon-contract."
          fi

      - name: Create live Neon preview branch
        if: steps.preview_config.outputs.configured == 'true' && github.event.action != 'closed'
        uses: neondatabase/create-branch-action@34f619c41c6e67b4f2f13f1c6eae90827a5f2cf4 # v5
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ github.head_ref }}
          api_key: ${{ env.NEON_API_KEY }}

      - name: Delete live Neon preview branch
        if: steps.preview_config.outputs.configured == 'true' && github.event.action == 'closed'
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ github.head_ref }}
          api_key: ${{ env.NEON_API_KEY }}
