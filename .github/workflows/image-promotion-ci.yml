name: image-promotion-ci

on:
  pull_request:
    paths:
      - "scripts/promote-image.sh"
      - "scripts/test-promote-image.sh"
      - "kubernetes/backend/kustomization.yaml"
      - "kubernetes/portal/kustomization.yaml"
      - ".github/workflows/image-promotion-ci.yml"
  push:
    branches: [main]
    paths:
      - "scripts/promote-image.sh"
      - "scripts/test-promote-image.sh"
      - "kubernetes/backend/kustomization.yaml"
      - "kubernetes/portal/kustomization.yaml"
      - ".github/workflows/image-promotion-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate image promotion and security regressions
        run: |
          bash -n scripts/promote-image.sh
          bash -n scripts/test-promote-image.sh
          bash scripts/test-promote-image.sh
