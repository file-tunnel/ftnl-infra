name: supabase-validate
on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase-validate.yml']
  push:
    branches: ['main']
    paths: ['supabase/**']
permissions:
  contents: read
jobs:
  catalog-and-layout:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run validate
