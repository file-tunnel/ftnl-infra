# Manual for the bootstrap release; promote an immutable image before sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ftnl-web-server
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: file-tunnel
  source:
    repoURL: https://github.com/file-tunnel/ftnl-infra.git
    targetRevision: main
    path: kubernetes/portal
  destination:
    server: https://kubernetes.default.svc
    namespace: file-tunnel
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
